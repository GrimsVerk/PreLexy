name: Review

# Soft review gate. An independent, read-only LLM reviews the PR diff against
# AGENTS.md and docs/DESIGN.md and exits non-zero on any blocking finding. Mark
# the `review` job a REQUIRED status check so a red review blocks merge exactly
# like a failing test — but it is layered ON TOP of CI (the hard gate), never a
# replacement for it. Only runs on pull requests (it needs the base..head diff).
on:
  pull_request:

permissions:
  contents: read

# One review per pull request head at a time. Without this, every push to a PR
# branch starts another review while the previous one is still running: the
# older run is judging a diff that no longer exists, and both draw on the same
# subscription budget as the workers that produced the change.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # A hung engine would otherwise sit on the runner for GitHub's six-hour
    # default with the pull request showing "in progress" the whole time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base and head commits are both present for the
          # base...head diff the review agent reviews.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Install the configured review engine. Default is claude; switch
      # REVIEW_ENGINE to codex once that engine's CI auth is wired (see below).
      - name: Install review engine
        env:
          REVIEW_ENGINE: claude
        run: |
          case "$REVIEW_ENGINE" in
            claude) npm install -g @anthropic-ai/claude-code ;;
            codex)  npm install -g @openai/codex ;;
            *) echo "unknown REVIEW_ENGINE: $REVIEW_ENGINE" >&2; exit 1 ;;
          esac
      - name: Headless review
        env:
          # Credentials come from a SUBSCRIPTION, not a metered API key.
          # claude: run `claude setup-token` once and store the result as the
          # CLAUDE_CODE_OAUTH_TOKEN secret (see README, manual setup). The metered
          # ANTHROPIC_API_KEY is only a fallback if you happen to have one.
          # Both are set unconditionally, so an unconfigured one arrives as the
          # empty string rather than being absent. review.sh unsets any empty
          # credential before invoking the engine — an empty ANTHROPIC_API_KEY
          # is not "no API key", it is an API key that fails to authenticate,
          # and it can take precedence over a perfectly good OAuth token.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # codex (FUTURE — not wired yet): must also run on a ChatGPT/Codex
          # SUBSCRIPTION, never a metered OPENAI_API_KEY. The Codex CLI keeps its
          # login in ~/.codex/auth.json; to enable this path, add a step before
          # this one that writes that file from a secret, then set REVIEW_ENGINE
          # to codex. Left unwired until a codex subscription is in use.
          REVIEW_ENGINE: claude
          # REVIEW_MODEL is optional. A different model than the workers is a
          # nice-to-have, not required — fresh context + read-only is the real
          # independence. Leave empty to use the subscription's default model.
          REVIEW_MODEL: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Which plan this PR is judged against is resolved from the branch
          # name (see .github/scripts/plan-resolve.sh).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: .github/scripts/review.sh
